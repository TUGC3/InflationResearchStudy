name: Daily Scrape

on:
  schedule:
    - cron: '0 6 * * *'  # UTC 06:00 = Türkiye 09:00
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas lxml

      - name: Mudo
        run: python InflationItems/Codes/ClothingStores/Mudo/scrape_mudo.py

      - name: SanatYapiOnline
        run: python InflationItems/Codes/ConstructionSuppliesMarkets/SanatYapiOnline/sanatYapiOnline_scraper.py

      - name: Macrocenter
        run: python InflationItems/Codes/Markets/Macrocenter/scrape_macrocenter.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add InflationItems/Datas/
          git diff --staged --quiet || git commit -m "data: $(date +'%Y-%m-%d')"
          git push