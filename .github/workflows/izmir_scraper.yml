name: Izmir Rent Data Scraper

on:
  workflow_dispatch: # Allows you to trigger the workflow manually from the Actions tab
  schedule:
    - cron: '0 0 * * 0' # (Optional) Runs automatically every Sunday at midnight

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    # Grants write permissions so the bot can push the newly scraped data (CSV) to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Matches the version in your error logs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Specified the full path to the requirements.txt file
          pip install -r Codes/HousesRent/Izmir/requirements.txt

      - name: Run Izmir Scraper
        run: |
          # Specified the full path to the Python script
          python Codes/HousesRent/Izmir/Izmir.py

      - name: Commit and Push Generated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Adding the new data to Git
          # Assumes your script saves the file to the 'Datas/HousesRent/Izmir' folder
          git add Datas/HousesRent/Izmir/izmir_rentals_full_dataset.csv
          
          # Adding a catch (|| echo) to prevent the workflow from failing if there is no new data to commit
          git commit -m "data: auto-update izmir rent dataset [skip ci]" || echo "No new data to commit"
          
          git push