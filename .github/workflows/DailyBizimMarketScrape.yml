name: DailyBizimMarket_scraper

# Hem manuel hem otomatik
on:
  workflow_dispatch:    # Manuel çalıştırma
  schedule:
    - cron: '0 2 * * *'  # Her gün 02:00 UTC (Türkiye saati 05:00)

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repo'yu çek
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Python kur
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3️⃣ Kütüphaneleri kur
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 webdriver-manager

      # 4️⃣ Chromium kur
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          sudo ln -s /usr/lib/chromium-browser/chromedriver /usr/bin/chromedriver

      # 5️⃣ Scraper scripti çalıştır
      - name: Run BizimToptan Scraper
        run: |
          python bizimtoptan_scraper.py

      # 6️⃣ CSV’yi artifact olarak yükle
      - name: Upload CSV Artifact
        uses: actions/upload-artifact@v3
        with:
          name: BizimToptan-CSV
          path: Datas/Markets/BizimToptan/*.csv
