name: Daily Cagri Market Scrape

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r Codes/Markets/Cagri/requirements.txt
          
      - name: Run scraper
        run: |
          python Codes/Markets/Cagri/cagri_scraper.py
          
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Datas/Markets/Cagri/
          git diff --quiet && git diff --staged --quiet || git commit -m "Add daily market data"
          git push
