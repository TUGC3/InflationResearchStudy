name: Pull & Bear Daily Scraper

on:
  schedule:
    - cron: '0 3 * * *'  # Her gün 06:00 Istanbul (UTC+3)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Create output directory
        run: mkdir -p Datas/ClothingStores/PullandBear

      - name: Run scraper
        run: |
          cd pullandbear
          python main.py

      - name: Commit and push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Datas/ClothingStores/PullandBear/pullandbear_prices.csv
          git diff --cached --quiet || git commit -m "Update Pull & Bear prices $(date +'%Y-%m-%d')"
          git push
