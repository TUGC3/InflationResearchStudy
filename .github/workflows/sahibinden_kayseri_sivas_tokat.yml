name: Daily House Rent Scraper (Kayseri, Sivas, Tokat)

on:
  schedule:
    # Runs at 02:00 UTC (05:00 TSİ) every day, offset by 1 hour from the other workflow
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape_houses:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install undetected-chromedriver beautifulsoup4 setuptools

      - name: Run House Rent Scraper
        env:
          HEADLESS: 'true' # Ensures your script uses options.add_argument('--headless=new')
        run: |
          # Make sure this path matches exactly where the script lives in your repository
          python Codes/HousesRent/KayseriSivasTokat/scrape_KayseriSivasTokat.py

      - name: Commit and push CSV files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add "Datas/HousesRent/Kayseri/" "Datas/HousesRent/Sivas/" "Datas/HousesRent/Tokat/"
          git commit -m "Auto-update daily house rent data (Kayseri/Sivas/Tokat) $(date +'%Y-%m-%d')" || exit 0
          git push origin HEAD:${{ github.ref }}
