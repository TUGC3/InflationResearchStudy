name: TKKoop Scraper

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python /Codes/Markets/Tarım_Kredi_Kooperatif/tkkoop_scraper.py

      - name: Commit CSV
        run: |
          TARGET_DIR="Datas/Markets/Tarım_Kredi_Kooperatif/"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$TARGET_DIR"/*.csv || echo "No CSV found"

          if ! git diff --cached --quiet; then
            git commit -m "Automated scrape: tkkoop $(date +'%F')"
            git push
          else
            echo "No changes to commit."
          fi
