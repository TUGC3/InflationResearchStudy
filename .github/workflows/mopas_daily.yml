name: Daily Mopaş Scraper

on:
  schedule:
    # 00:00 UTC translates to 03:00 AM Istanbul time
    - cron: '0 0 * * *'
  workflow_dispatch: # This adds a button to the GitHub website so you can test it manually

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    # This is the magic block from your friend that prevents the Error 403
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas

    - name: Run Python script
      run: python Codes/Markets/Mopas/mopas_scraper.py

    - name: Upload CSV as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mopas-daily-data
        path: Datas/Markets/Mopas/*.csv

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add "Datas/Markets/Mopas/"
        git commit -m "Auto-update daily prices CSV for Mopaş" || exit 0
        git push origin HEAD:${{ github.ref }}
