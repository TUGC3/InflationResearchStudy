name: Daily Rental Scraper (antep maras kilis)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
    
    - name: Install Python packages
      run: |
        pip install undetected-chromedriver beautifulsoup4 selenium
    
    - name: Create data directories
      run: mkdir -p Datas/HousesRent/{Maras,Antep,Kilis}
    
    - name: Run scraper
      run: python Codes/HousesRent/Antep_Maras_Kilis/antep_maras_kilis.py.py
      env:
        HEADLESS: "true"
    
    - name: Commit data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Datas/HousesRent/
        git diff --staged --quiet || (git commit -m "Update rental data $(date +'%Y-%m-%d')" && git push)
