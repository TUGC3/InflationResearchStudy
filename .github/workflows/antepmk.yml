name: Daily Rental Scraper

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: daily-rental-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r Codes/HousesRent/Antep_Maras_Kilis/requirements.txt

      - name: Run scraper
        env:
          HEADLESS: "true"
          TZ: "UTC"
        run: |
          python Codes/HousesRent/Antep_Maras_Kilis/antep_maras_kilis.py

      - name: Commit data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Datas/HousesRent/
          git diff --staged --quiet || (git commit -m "Update rental data (auto)" && git push)
