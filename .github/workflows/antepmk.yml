name: Daily Rental Scraper (Antep Maras Kilis)

on:
  schedule:
    # Run at 03:00 UTC every day (adjust as needed)
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          wget \
          unzip \
          xvfb \
          libxi6 \
          libgconf-2-4 \
          libxss1 \
          libnss3 \
          libx11-xcb1 \
          libxcb-dri3-0 \
          libdrm2 \
          libgbm1 \
          libasound2
    
    - name: Install Chrome
      run: |
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install undetected-chromedriver beautifulsoup4 selenium
    
    - name: Create data directories
      run: |
        mkdir -p Datas/HousesRent/{Maras,Antep,Kilis}
    
    - name: Run scraper
      run: python Codes/HousesRent/Antep_Maras_Kilis/antep_maras_kilis.py
      env:
        HEADLESS: "true"
        PYTHONUNBUFFERED: 1
    
    - name: Commit and push data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Datas/HousesRent/
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update: Rental data $(date +'%Y-%m-%d')"
          git push
        fi
