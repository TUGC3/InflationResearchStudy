name: Daily Scraper - Diyarbakir Sanliurfa Mardin

on:
  schedule:
    - cron: "0 6 * * *"  # Her gün sabah 06:00 UTC (Türkiye 09:00)
  workflow_dispatch:       # Manuel tetikleme butonu

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: Codes/HousesRent/DiyarbakirSanliurfaMardin
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run scraper
        working-directory: Codes/HousesRent/DiyarbakirSanliurfaMardin
        run: python scrape_diyarbakir_sanliurfa_mardin.py
        env:
          CI: "true"

      - name: Commit and push CSV files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Datas/
          git diff --cached --quiet || git commit -m "Data: $(date +'%Y-%m-%d') Diyarbakir-Sanliurfa-Mardin"
          git push
