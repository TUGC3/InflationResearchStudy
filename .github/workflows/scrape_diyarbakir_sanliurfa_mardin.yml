name: Daily House Rent Scraper (Diyarbakir, Sanliurfa, Mardin)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape_houses:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install undetected-chromedriver beautifulsoup4 setuptools

      - name: Run House Rent Scraper
        run: |
          python Codes/HousesRent/DiyarbakirSanliurfaMardin/scrape_diyarbakir_sanliurfa_mardin.py

      - name: Commit and push CSV files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add "Datas/HousesRent/Diyarbakir/" "Datas/HousesRent/Sanliurfa/" "Datas/HousesRent/Mardin/"
          git commit -m "Auto-update daily house rent data (Diyarbakir/Sanliurfa/Mardin) $(date +'%Y-%m-%d')" || exit 0
          git push origin HEAD:${{ github.ref }}
