name: Daily Arden Scraper

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Bağımlılıkları Yükle
        run: |
          pip install selenium webdriver-manager

      - name: Arden Market Scraper Çalıştır
        # Burada "python" komutundan önce klasöre giriş yapıyoruz (cd)
        # Bu yöntem path hatalarını %100 çözer.
        run: |
          cd Codes/Markets/Arden
          python arden_scraper.py

      - name: Verileri Kaydet ve Pushla
        run: |
          git config --global user.name "Scraper Bot"
          git config --global user.email "bot@github.com"
          
          # Eğer Python kodu veriyi direkt 'Datas/Markets/Arden' içine atıyorsa:
          git add Datas/Markets/Arden/*.csv || echo "Dosya bulunamadı"
          
          git commit -m "Arden Veri Güncelleme: $(date +'%Y-%m-%d')" || echo "Yeni veri yok"
          git push
