name: Daily Arden Scraper

on:
  schedule:
    - cron: '0 3 * * *' # Her gün TR saatiyle 06:00 (UTC 03:00)
  workflow_dispatch: # Manuel çalıştırma butonu (Test için)

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Bağımlılıkları Yükle
        run: |
          pip install selenium webdriver-manager

      - name: Arden Market Scraper Çalıştır
        # Tam klasör yolunu veriyoruz
        run: python Codes/Markets/Arden/arden_scraper.py

      - name: Verileri Kaydet ve Pushla
        run: |
          git config --global user.name "Scraper Bot"
          git config --global user.email "bot@github.com"
          
          # Script içindeki 'data' klasörüne kaydedilen CSV'leri ekler
          # (Eğer data klasörü ana dizindeyse git add data/*.csv yeterli)
          git add data/*.csv || git add Codes/Markets/Arden/data/*.csv
          
          git commit -m "Arden Veri Güncelleme: $(date +'%Y-%m-%d')" || echo "Değişiklik yok"
          git push
