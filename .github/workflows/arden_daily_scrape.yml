name: Daily Arden Scraper

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Bağımlılıkları Yükle
        run: pip install selenium webdriver-manager

      - name: Arden Market Scraper Çalıştır
        # Bu komut klasör ismindeki büyük/küçük harf hatasını (Codes vs codes) bypass eder
        run: |
          PYTHONPATH=$PYTHONPATH:$(pwd) python $(find . -name "arden_scraper.py")

      - name: Verileri Kaydet ve Pushla
        run: |
          git config --global user.name "Scraper Bot"
          git config --global user.email "bot@github.com"
          
          # Datas klasörünü zorla oluştur ve tüm CSV'leri ekle
          mkdir -p Datas/Markets/Arden
          git add Datas/Markets/Arden/*.csv || echo "Eklenecek dosya bulunamadı"
          
          git commit -m "Arden Veri Güncelleme: $(date +'%Y-%m-%d')" || echo "Değişiklik yok"
          git push
