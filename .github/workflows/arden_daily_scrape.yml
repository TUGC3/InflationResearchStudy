        run: python Codes/Markets/Arden/arden_scraper.py

      - name: Verileri Kaydet ve Pushla
        run: |
          git config --global user.name "Scraper Bot"
          git config --global user.email "bot@github.com"
          
          # Verilerin Datas/Markets/Arden/ içinde oluştuğundan emin oluyoruz
          git add Datas/Markets/Arden/*.csv
          
