name: Sok Market Daily Scraper

on:
  schedule:
    - cron: "0 8 * * *"   # Runs every day at 08:00 UTC
  workflow_dispatch:      # Manual trigger

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Necessary to push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          X-Ecommerce-Deviceid: ${{ secrets.X_ECOMMERCE_DEVICEID }}
          X-Ecommerce-Sid: ${{ secrets.X_ECOMMERCE_SID }}
          Cookie: ${{ secrets.COOKIE }}
        run: |
          # The scraper is expected to generate new CSV files in the 'data/' folder
          python Codes/Markets/sok_market_scraper/sok_market_scraper.py

      - name: Process and Push New Files
        run: |
          # Set the destination path
          TARGET_DIR="Datas/Markets/sok_market/"

          # Setup Git credentials
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the files in our target directory
          git add $TARGET_DIR/*.csv
          
          # Check for changes; commit and push only if there's something new
          if ! git diff --cached --quiet; then
            git commit -m "Automated scrape: sok_market $(date +'%F')"
            git push
          else
            echo "No changes to commit."
          fi