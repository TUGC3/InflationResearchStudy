name: Daily House Rent Scraper (Eskisehir, Bolu, Bartin, Zonguldak)

on:
  schedule:
    - cron: '0 1 * * *'  # 04:00 TSİ
  workflow_dispatch:

jobs:
  scrape_houses:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install undetected-chromedriver==3.5.5 selenium==4.16.0 beautifulsoup4==4.12.3

      - name: Run House Rent Scraper
        run: |
          python Codes/HousesRent/Eskisehir_Bolu_Bartin_Zonguldak/scrape_EskisehirBoluBartinZonguldak.py

      - name: Commit and push CSV files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add "Datas/HousesRent/Eskisehir_Bolu_Bartin_Zonguldak/Eskişehir/" \
                  "Datas/HousesRent/Eskisehir_Bolu_Bartin_Zonguldak/Bolu/" \
                  "Datas/HousesRent/Eskisehir_Bolu_Bartin_Zonguldak/Bartın/" \
                  "Datas/HousesRent/Eskisehir_Bolu_Bartin_Zonguldak/Zonguldak/"
          git commit -m "Auto-update daily house rent data (Eskisehir/Bolu/Bartin/Zonguldak) $(date +'%Y-%m-%d')" || exit 0
          git push origin HEAD:${{ github.ref }}
